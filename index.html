<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-eval' 'sha256-jAzopqXweGi8yvjsMsPZB8rMpGhZhQEP0mael07NBuY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; base-uri 'self'; object-src 'none'">
  <!-- Aplica el tema elegido antes de pintar. Si se cambia este script, hay que actualizar su hash en la política de arriba. -->

  <title>Gastos del hogar</title>
  <!-- Valor inicial; js/tema.js lo cambia según el tema (y respeta el que se elija en la app). -->
  <meta name="theme-color" content="#F8FAFC">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.42/dist/vue.global.prod.js" integrity="sha256-quYzmg50TMNQPyo65j9e4Nmc459FUX56Ufy57MKQyiw=" crossorigin="anonymous"></script>
  <script type="module" src="js/main.js"></script>
