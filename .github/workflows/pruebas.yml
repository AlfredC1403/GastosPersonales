name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No hay dependencias que instalar: las pruebas usan solo `node --test`.
      - run: npm test
